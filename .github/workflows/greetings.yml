name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Olá! Bem vindo ao AlfaChat. Muito obrigado por contribuir. Lembre-se das regras gerais de criação de issues.'
        pr-message: 'Olá! Bem vindo ao AlfaChat. Saiba que a sua contribuição é muito valiosa para nós. Muito obrigado!'
